name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - onsen0ksa-cloud-onsen-static-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble clean Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/gallery
          cp index.html booking.html menu.html services.html script.js styles.css \
            logo-modern.png logo-transparent.png logo.png robots.txt sitemap.xml security.txt _site/
          cp assets/hero-onsen.jpeg assets/ambient.mp3 \
            assets/japanese-ambient.wav assets/rainy-japanese-ambient.wav _site/assets/
          cp assets/gallery/* _site/assets/gallery/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
