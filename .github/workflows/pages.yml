name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - onsen0ksa-cloud-onsen-static-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Google reviews
        env:
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          page_path = Path("index.html")
          page = page_path.read_text(encoding="utf-8")
          settings = {
              "google-maps-api-key": os.environ.get("GOOGLE_MAPS_API_KEY", "").strip(),
              "google-place-id": os.environ.get("GOOGLE_PLACE_ID", "").strip(),
          }

          for name, value in settings.items():
              pattern = re.compile(
                  rf'(<meta name="{re.escape(name)}" content=")[^"]*(">)'
              )
              page, replacements = pattern.subn(
                  lambda match: f"{match.group(1)}{html.escape(value, quote=True)}{match.group(2)}",
                  page,
                  count=1,
              )
              if replacements != 1:
                  raise SystemExit(f"Expected exactly one {name} meta tag in index.html")

          page_path.write_text(page, encoding="utf-8")
          PY

      - name: Assemble clean Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/gallery _site/.well-known
          cp index.html booking.html menu.html services.html script.js styles.css \
            logo-modern.png logo-transparent.png logo.png robots.txt sitemap.xml security.txt _site/
          cp .well-known/security.txt _site/.well-known/security.txt
          cp assets/hero-onsen.jpeg assets/onsen-rainfall.mp3 assets/japanese-wooden-bells.wav assets/onsen-wind.wav _site/assets/
          cp assets/gallery/* _site/assets/gallery/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
